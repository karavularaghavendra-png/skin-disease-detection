name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --filename='*.py' --max-line-length=120 --extend-ignore=E,W,F --exclude=.venv,dataset,notebooks,raw_images,.git || true

      - name: Run tests
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pytest tests/ -v \
            --ignore=.venv --ignore=dataset --ignore=notebooks \
            -k "not live and not batch and not e2e and not demo" \
            --cov=utils \
            --cov-report=term-missing \
            --cov-fail-under=0 || true
