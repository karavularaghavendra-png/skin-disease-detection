name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 *.py utils/ --max-line-length=120 --extend-ignore=E203,W503,E501
        continue-on-error: true

      - name: Run tests
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pytest tests/ -v \
            --ignore=.venv --ignore=dataset --ignore=notebooks \
            -k "not live and not batch and not e2e and not demo" \
            --cov=utils \
            --cov-report=term-missing \
            --cov-fail-under=0
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t skin-disease-ai:test .
