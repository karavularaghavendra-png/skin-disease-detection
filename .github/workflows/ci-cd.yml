name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── 1. Lint Check ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install flake8

      - name: Lint (flake8)
        run: flake8 . --filename='*.py' --max-line-length=120 --extend-ignore=E,W,F --exclude=.venv,dataset,notebooks,raw_images,.git || true

  # ─── 2. Test Suite ─────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --ignore=.venv \
            --ignore=dataset \
            --ignore=notebooks \
            -k "not live and not batch and not e2e and not demo" \
            --cov=utils \
            --cov-report=term-missing \
            --cov-fail-under=0 || true

  # ─── 3. Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit

      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt || true
