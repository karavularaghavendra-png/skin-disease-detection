name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── 1. Lint Check ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install flake8

      - name: Lint (flake8)
        run: flake8 . --filename='*.py' --max-line-length=120 --extend-ignore=E203,W503,E501,E302,E303,E266,E265,W291,W292,W293,E128,E127,E126,E125,E124,E123,E116,E114,E111,E117,W504,E741,E402,F401,E722,W605,E711,E712,W391 --exclude=.venv,dataset,notebooks,raw_images,.git

  # ─── 2. Test Suite ─────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --ignore=.venv \
            --ignore=dataset \
            --ignore=notebooks \
            -k "not live and not batch and not e2e and not demo" \
            --cov=utils \
            --cov-report=term-missing \
            --cov-fail-under=0

  # ─── 3. Security Scan ──────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit

      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-272 --ignore-vuln GHSA-34jh-p97f-mpxf || true
