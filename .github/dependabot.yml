version: 2

updates:
  # ─── Python Dependencies ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    groups:
      # Group minor/patch ML library updates together
      ml-libraries:
        patterns:
          - "tensorflow*"
          - "keras*"
          - "numpy*"
          - "scikit-learn*"
          - "Pillow*"
          - "opencv*"
        update-types:
          - "minor"
          - "patch"
      # Group web framework updates
      web-frameworks:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "streamlit*"
          - "slowapi*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Don't auto-update major TensorFlow versions (breaking changes)
      - dependency-name: "tensorflow"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # ─── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # ─── Docker Base Image ────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
